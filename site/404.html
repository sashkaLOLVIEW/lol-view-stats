<!doctype html>
<html lang="en">
<head>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap">
<style>
html { scrollbar-gutter: stable; }
:root { --bg: #0f0f0f; --surface: #1b1b1b; --line: #383838; --fg: #ffffff; --muted: #8d8d8d; --dim: #626262; --on-bg: #ffffff; --on-fg: #0f0f0f; --font: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color-scheme: dark; }
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) { --bg: #f2f2f0; --surface: #ffffff; --line: #d3d3ce; --fg: #121212; --muted: #6a6a6a; --dim: #8e8e8e; --on-bg: #121212; --on-fg: #ffffff; color-scheme: light; } }
:root[data-theme="light"] { --bg: #f2f2f0; --surface: #ffffff; --line: #d3d3ce; --fg: #121212; --muted: #6a6a6a; --dim: #8e8e8e; --on-bg: #121212; --on-fg: #ffffff; color-scheme: light; }
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font); display: flex; flex-direction: column; }
.bar { height: 35px; display: flex; align-items: center; padding: 0 max(16px, env(safe-area-inset-left, 0px)); background: var(--surface); border-bottom: 1px solid var(--line); }
.bar a { display: inline-flex; align-items: center; gap: 8px; color: var(--fg); text-decoration: none; font-weight: 700; font-size: 14px; letter-spacing: .02em; }
.bar svg { width: 20px; height: 20px; }
main { flex: 1; display: grid; place-items: center; padding: 40px 20px 80px; text-align: center; }
.code { font-size: clamp(88px, 22vw, 168px); font-weight: 700; line-height: 1; letter-spacing: -.02em; margin: 0; color: var(--fg); }
.code span { color: var(--dim); }
h1 { margin: 18px 0 8px; font-size: 20px; font-weight: 600; }
p { margin: 0 auto 28px; max-width: 420px; color: var(--muted); font-size: 13px; line-height: 1.6; }
.btn { display: inline-flex; align-items: center; gap: 10px; height: 44px; padding: 0 22px; border-radius: 10px; background: var(--on-bg); color: var(--on-fg); text-decoration: none; font: 600 14px var(--font); }
.btn:hover { opacity: .88; }
.path { margin-top: 22px; font-size: 11px; color: var(--dim); word-break: break-all; }
</style>
<script>try { var t = localStorage.getItem('theme'); if (t) document.documentElement.setAttribute('data-theme', t); } catch (e) {}</script>
</head>

</html>
