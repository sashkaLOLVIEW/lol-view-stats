name: Update data and publish site

on:
  schedule:
    - cron: "*/20 * * * *"      # every 20 minutes: lolesports schedule, Riot feed games, items (Oracle's Elixir's file is NOT downloaded on these runs)
    - cron: "10 7 * * *"        # once a day at 07:10 UTC (07:10 UK in winter; 08:10 UK during BST), after Oracle's Elixir's daily update (~07:05 UK)
  workflow_dispatch:             # "Run workflow" button in the Actions tab
  push:
    branches: [main]             # also rebuild whenever you change the pages or scripts

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore cached schedule and item data
        uses: actions/cache@v4
        with:
          path: |
            data/schedule.json
            data/items_cache.json
            data/item_icons.json
            data/riot_games.json
            data/bootcamp.json
            data/soloq_accounts.json
          key: cache-${{ github.run_id }}
          restore-keys: cache-
      - name: Restore the last Oracle's Elixir file
        id: oecache
        uses: actions/cache/restore@v4
        with:
          path: data/2026_LoL_esports_match_data_from_OraclesElixir.csv
          key: oe-csv-${{ github.run_id }}
          restore-keys: oe-csv-
      - name: Download upcoming matches
        env:
          LOLESPORTS_API_KEY: ${{ secrets.LOLESPORTS_API_KEY }}
        run: |
          mkdir -p runlog
          set -o pipefail; python fetch_schedule.py 2>&1 | tee runlog/schedule.txt
      - name: Download item builds
        env:
          LOLESPORTS_API_KEY: ${{ secrets.LOLESPORTS_API_KEY }}
        run: |
          mkdir -p runlog
          set -o pipefail; python fetch_items.py 2>&1 | tee runlog/items.txt
      - name: Download finished games from Riot
        env:
          LOLESPORTS_API_KEY: ${{ secrets.LOLESPORTS_API_KEY }}
        run: |
          mkdir -p runlog
          set -o pipefail; python fetch_riot_games.py 2>&1 | tee runlog/riot_games.txt
      - name: Download newest data (Oracle's Elixir updates once a day, so the 20-minute runs reuse the saved file)
        id: oedl
        if: github.event.schedule != '*/20 * * * *' || steps.oecache.outputs.cache-hit == ''
        env:
          DRIVE_API_KEY: ${{ secrets.DRIVE_API_KEY }}
          DATA_FOLDER_ID: ${{ vars.DATA_FOLDER_ID }}
        run: python fetch_data.py
      - name: Save the Oracle's Elixir file for the 20-minute runs
        if: steps.oedl.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: data/2026_LoL_esports_match_data_from_OraclesElixir.csv
          key: oe-csv-${{ github.run_id }}
      - name: Download soloQ ranks (Bootcamp page)
        env:
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
        run: |
          mkdir -p runlog
          set -o pipefail; python fetch_bootcamp.py 2>&1 | tee runlog/bootcamp.txt
      - name: Build site
        run: |
          mkdir -p runlog
          set -o pipefail; python build.py 2>&1 | tee runlog/build.txt
      - name: Save the run log (branch run-log, for debugging)
        if: always()
        run: |
          [ -f data/riot_games.json ] && python -c "import json;d=json.load(open('data/riot_games.json'));print(len(d),'games saved');[print(k,v.get('mid'),[t['code'] for t in v['teams']],v['number']) for k,v in d.items()]" > runlog/riot_saved.txt 2>&1 || echo "no riot_games.json" > runlog/riot_saved.txt
          cd runlog && git init -q && git checkout -q -b run-log && git add -A && git -c user.name=bot -c user.email=bot@users.noreply.github.com commit -qm "run log $GITHUB_RUN_ID" && git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" run-log || true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
