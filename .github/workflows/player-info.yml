name: Update player ages and contracts

on:
  workflow_dispatch:           # "Run workflow" button; run it again if the wiki rate-limits
  schedule:
    - cron: "30 3 * * *"       # daily, 03:30 UTC (players are only looked up again after 7 days)

permissions:
  contents: write              # saves config/player_info_auto.json into the repository
  actions: write               # lets it start the site rebuild afterwards

concurrency:
  group: player-info
  cancel-in-progress: false

jobs:
  lookup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Download newest data (to know which players are on the site)
        env:
          DRIVE_API_KEY: ${{ secrets.DRIVE_API_KEY }}
          DATA_FOLDER_ID: ${{ vars.DATA_FOLDER_ID }}
        run: python fetch_data.py
      - name: Look up ages and contracts
        run: python fetch_player_info.py
      - name: Look up LPL rosters (players, subs, coaches)
        run: python fetch_lpl_rosters.py
      - name: Save results and rebuild the site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/player_info_auto.json
          [ -f config/lpl_roster_auto.json ] && git add config/lpl_roster_auto.json || true
          if git diff --cached --quiet; then echo "nothing new to save"; else
            git commit -m "Update player ages and contracts"
            git push
            gh workflow run update.yml
          fi
